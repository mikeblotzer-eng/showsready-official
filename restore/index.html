<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="description" content="Field app for water damage restoration technicians: floor plan sketching, moisture mapping, S500 equipment sizing, daily monitoring logs, drive tracking and job costing.">
<title>RestoreMap — Restoration Field App</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark">RM</div>
  <p>Loading field data…</p>
</div>

<header class="app-head" hidden>
  <button class="icon-btn" id="btn-jobs" aria-label="Jobs">☰</button>
  <div class="head-job">
    <strong id="head-title">No job open</strong>
    <span id="head-sub"></span>
  </div>
  <div class="head-right">
    <span class="chip chip-offline" id="net-chip" hidden>Offline</span>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main id="view" class="view" hidden></main>

<nav class="tabbar" id="tabbar" hidden>
  <button data-route="plan"      class="tab"><span class="tab-ico">▦</span>Plan</button>
  <button data-route="readings"  class="tab"><span class="tab-ico">◈</span>Readings</button>
  <button data-route="equipment" class="tab"><span class="tab-ico">➤</span>Equip</button>
  <button data-route="daily"     class="tab"><span class="tab-ico">▤</span>Daily</button>
  <button data-route="money"     class="tab"><span class="tab-ico">$</span>Money</button>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
