[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.showsready.com/*"
  to = "https://showsready.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/refund.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# DryLine Field — restoration technician PWA. These must come before the
# catch-all, and the app's own paths must not be swallowed by it.
[[redirects]]
  from = "/restore"
  to = "/restoration/index.html"
  status = 200

[[redirects]]
  from = "/restoration"
  to = "/restoration/index.html"
  status = 200

[[redirects]]
  from = "/restoration/*"
  to = "/restoration/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from cache, or an update can never
# land on a device that already installed the app.
[[headers]]
  for = "/restoration/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/restoration/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
