[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.showsready.com/*"
  to = "https://showsready.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/refund.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/restore"
  to = "/restore/index.html"
  status = 200

[[redirects]]
  from = "/restore/*"
  to = "/restore/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from a stale cache, or an update can
# take days to reach a technician's phone.
[[headers]]
  for = "/restore/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/restore/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
